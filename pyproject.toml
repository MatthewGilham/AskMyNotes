[project]
name = "askmynotes"
version = "0.1.0"
description = "A personal AI chatbot with agentic RAG over my lecture slides"
readme = "README.md"
authors = [
    { name = "Matthew Gilham", email = "325295499+MatthewGilham@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "markitdown[pptx,docx,xlsx]>=0.1.9",
    "pydantic-settings>=2.16.1",
    "pymupdf4llm>=1.28,<2",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
askmynotes = "askmynotes.main:run"
askmynotes-check-model = "askmynotes.check_model:main"
askmynotes-convert-notes = "askmynotes.notes.convert_cli:main"
askmynotes-eval = "askmynotes.evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"
module-name = "askmynotes"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Test scratch files stay inside the project (data/ is never committed).
addopts = "--basetemp=data/test_tmp"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint.isort]
known-first-party = ["askmynotes"]
