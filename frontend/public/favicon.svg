<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The app's mark (design/Mark.tsx) in Volt colours on a tile of Volt's
       base colour. The browser tab shows it, and assets/askmynotes.ico is
       rendered from it. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccff33" />
      <stop offset="1" stop-color="#3dffc0" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0c0814" />
  <g transform="translate(3.2 3.4) scale(0.8)">
    <rect x="9" y="3" width="20" height="16" rx="4" fill="none"
      stroke="url(#accent)" stroke-width="2" opacity="0.55" />
    <path fill-rule="evenodd" fill="url(#accent)"
      d="M7 10h16a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4Z
         M17.5 12.5 10.5 20h4.5l-2 5.5 7-7.5h-4.5l2-5.5Z" />
  </g>
</svg>
